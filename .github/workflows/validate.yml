name: 文件與離線測試 / Repository validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 檔案政策 / File policy
        run: python scripts/check_repository.py
      - name: 安裝展示網站依賴 / Install demo dependencies
        run: python -m pip install -r 'MuscleCore分析資料/website/requirements-test.txt'
      - name: 隔離 D4 探針範圍與清理 / D4 probe safety contracts
        run: |
          node --test scripts/test_remote_d4_runner.cjs
          python -m pytest scripts/test_remote_d4_consumer_probe.py -q -p no:cacheprovider
      - name: 網站離線測試 / Offline demo tests
        working-directory: MuscleCore分析資料/website
        run: python -m pytest tests -q -p no:cacheprovider
      - name: 合成資料離線回歸 / Synthetic fixture regression
        working-directory: MuscleCore分析資料/website
        run: python -m pytest ../../VibeCart_AI/MongoDB/test_data -q -p no:cacheprovider
      - name: 備份清冊與復原比對工具 / Backup manifest contracts
        run: python -m pytest scripts/test_backup_manifest.py -q -p no:cacheprovider
      - name: 雲端來源白名單封裝 / Cloud source allowlist
        run: |
          python -m pytest scripts/test_prepare_cloud_source.py -q -p no:cacheprovider
          python scripts/prepare_cloud_source.py --output "$RUNNER_TEMP/vibecart-source.tar.gz"
