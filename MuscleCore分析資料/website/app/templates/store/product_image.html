{% if p.image_urls %}<img src="{{ p.image_urls[0] }}" alt="{{ p.name }}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='{{ url_for('static', filename='img/product-placeholder.svg') }}'">{% else %}<img src="{{ url_for('static', filename='img/product-placeholder.svg') }}" alt="{{ p.name }}（暫無商品圖片）" loading="lazy">{% endif %}
