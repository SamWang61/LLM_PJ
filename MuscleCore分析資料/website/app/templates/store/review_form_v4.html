<section class="section" id="product-reviews"><h2>購買商品評價</h2>
<p>本人已付款且完成或送達的每筆訂單明細可評價一次。星等採真實評價平均，無條件進位至小數一位。</p>
{% for item in reviewable_items %}
<form method="post" action="{{ url_for('store.submit_review', order_item_id=item._id) }}" data-review-form>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<p>訂單 {{ item.review_order_number }} · 本次購買 {{ item.quantity|default(1) }} 件</p>
<label>星等 <select name="rating" required>{% for star in range(5, 0, -1) %}<option value="{{ star }}">{{ star }}星</option>{% endfor %}</select></label>
<label>評價標題 <input name="title" maxlength="200"></label>
<label>使用心得 <textarea name="content" maxlength="8000"></textarea></label>
<button class="button" type="submit">送出評價</button><p role="status" data-review-status></p>
</form>
{% else %}<p>目前沒有可評價的訂單明細。請確認已登入、訂單已付款且完成或送達；已評價的明細不可重複評價。</p>{% endfor %}
</section>
